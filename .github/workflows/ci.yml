name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bfi
          POSTGRES_PASSWORD: clave_solo_ci
          POSTGRES_DB: businessflow
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bfi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: bfi
      POSTGRES_PASSWORD: clave_solo_ci
      POSTGRES_DB: businessflow
      POSTGRES_PORT: 5433
      JWT_SECRET: secreto_efimero_solo_para_la_ejecucion_de_ci_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w server   # comprobación de tipos
      - run: npm test
      - run: npm run build -w web
